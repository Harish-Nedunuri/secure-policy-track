version: '3.8'

# Shared volumes remain the same
volumes:
  db_storage:
    name: n8n_self_host_db_storage
    external: true

  n8n_storage:
    name: n8n_self_host_n8n_storage
    external: true

  redis_storage:
    name: n8n_self_host_redis_storage
    external: true

  traefik_data:
    external: true

x-shared: &shared
  restart: always
  image: docker.n8n.io/n8nio/n8n
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY}
    # IMPORTANT: Use your final domain with HTTPS
    - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
    - N8N_PORT=5678
    - N8N_PROTOCOL=https
    - NODE_ENV=production
    - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
    - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
  links:
    - postgres
    - redis
  volumes:
    - n8n_storage:/home/node/.n8n
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  ###################################################################
  # TRAEFIK - Reverse Proxy & Let's Encrypt
  ###################################################################
  traefik:
    image: "traefik"
    restart: always
    command:
      - "--api=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

    # labels:
    #   If you want to expose the Traefik dashboard at a domain, you could uncomment and convert to mapping syntax. Example:
    #   traefik.http.routers.api.rule: "Host(`traefik.your-domain.com`)"
    #   traefik.http.routers.api.service: "api@internal"
    #   traefik.http.routers.api.entrypoints: "websecure"
    #   traefik.http.routers.api.tls.certresolver: "myresolver"
    #   etc.
    #   Currently empty because they're all commented out.

  ###################################################################
  # POSTGRES
  ###################################################################
  postgres:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_NON_ROOT_USER=${POSTGRES_NON_ROOT_USER}
      - POSTGRES_NON_ROOT_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
    volumes:
      - db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  ###################################################################
  # REDIS
  ###################################################################
  redis:
    image: redis:6-alpine
    restart: always
    volumes:
      - redis_storage:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  ###################################################################
  # N8N - Main Web
  ###################################################################
  n8n:
    <<: *shared
    # We do NOT expose port 5678 publicly; Traefik will handle that
    labels:
      traefik.enable: "true"
      # Router for the MAIN domain on HTTPS (websecure)
      traefik.http.routers.n8n.rule: "Host(`bizmonin8n.uksouth.cloudapp.azure.com`)"
      traefik.http.routers.n8n.entrypoints: "websecure"
      # Updated certificate resolver to match Traefik's configuration
      traefik.http.routers.n8n.tls.certresolver: "mytlschallenge"

      # Optional: HTTP → HTTPS redirect
      traefik.http.routers.n8n-web.rule: "Host(`bizmonin8n.uksouth.cloudapp.azure.com`)"
      traefik.http.routers.n8n-web.entrypoints: "web"
      traefik.http.middlewares.n8n-redirect.redirectscheme.scheme: "https"
      traefik.http.routers.n8n-web.middlewares: "n8n-redirect"

      # Tell Traefik which internal port to route to
      traefik.http.services.n8n.loadbalancer.server.port: "5678"

  ###################################################################
  # N8N WORKER
  ###################################################################
  n8n-worker:
    <<: *shared
    command: worker
    depends_on:
      - n8n
